<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  routes = {
    'TGTC Website.dc.html': 'home',
    'Index.dc.html': 'index',
    'Intelligence.dc.html': 'intelligence',
    'Governance.dc.html': 'governance',
    'Desire.dc.html': 'desire',
    'Production.dc.html': 'production',
    'Growth.dc.html': 'growth'
  };

  state = { route: 'home' };

  componentDidMount() {
    this.readHash();
    this.onHash = () => this.readHash();
    window.addEventListener('hashchange', this.onHash);
    this.onClick = e => {
      const a = e.target.closest && e.target.closest('a');
      if (!a) return;
      const href = a.getAttribute('href');
      if (!href) return;
      const hit = Object.keys(this.routes).find(f => href.indexOf(f) === 0);
      if (!hit) return;
      e.preventDefault();
      const anchor = href.indexOf('#') >= 0 ? href.slice(href.indexOf('#') + 1) : '';
      const route = this.routes[hit];
      window.location.hash = route + (anchor ? '/' + anchor : '');
    };
    document.addEventListener('click', this.onClick, true);
  }
  componentWillUnmount() {
    window.removeEventListener('hashchange', this.onHash);
    document.removeEventListener('click', this.onClick, true);
  }

  readHash() {
    const raw = (window.location.hash || '').replace(/^#/, '');
    const parts = raw.split('/');
    const names = ['home', 'index', 'intelligence', 'governance', 'desire', 'production', 'growth'];
    const route = names.indexOf(parts[0]) >= 0 ? parts[0] : 'home';
    const changed = route !== this.state.route;
    this.setState({ route });
    const anchor = parts[1];
    setTimeout(() => {
      if (anchor) {
        const el = document.getElementById(anchor);
        if (el) { window.scrollTo(0, el.getBoundingClientRect().top + window.scrollY - 64); return; }
      }
      if (changed) window.scrollTo(0, 0);
    }, changed ? 260 : 60);
  }

  renderVals() {
    const r = this.state.route;
    return {
      isHome: r === 'home',
      isIndex: r === 'index',
      isIntelligence: r === 'intelligence',
      isGovernance: r === 'governance',
      isDesire: r === 'desire',
      isProduction: r === 'production',
      isGrowth: r === 'growth'
    };
  }
}
</script>
